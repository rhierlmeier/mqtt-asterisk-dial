
# Configuration for the direct SIP dialer to Fritzbox
broker: tcp://localhost:1883
client_id: mqtt-sip-dial
username: mqtt_user
password: mqtt_password

sip:
  host: 192.168.178.1
  user: fritzbox_user
  password: fritzbox_password

numbers:
  - 089/123133
  - 089/123134

messages:
  - mqtt_topic: homie/hargassner/stoerung/active
    variables:
      - name: storeNr
        mqtt_topic: homie/hargassner/stoerung/nr
    audio_file: /home/pi/audio/${storeNr}.wav
      
    
